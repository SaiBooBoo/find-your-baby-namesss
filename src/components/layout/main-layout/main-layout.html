<nz-layout>
  <nz-header>
    <h1 class="logo">Find Your Baby Names</h1>
    <ul nz-menu nzTheme="dark" nzMode="horizontal" class="header-menu">
    </ul>
  </nz-header>

  <nz-content>
    <div class="content">
      <app-search-component
        (searchChange)="onSearchChange($event)"
        (genderChange)="onGenderChange($event)"
      ></app-search-component>
      <app-display-name
        [searchTerm]="searchTerm"
        [selectedSex]="selectedSex"
      ></app-display-name>
    </div>
  </nz-content>

  <nz-footer class="app-footer">
  <span>© 2026 Sai Shen. All rights reserved.</span>
</nz-footer>
</nz-layout>
